<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exams — Nexa Dev</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dev.css">
</head>
<body>
  <div class="dev-shell">
    <aside class="dev-sidebar">
      <div class="dev-brand"><span class="dev-brand-mark">NX</span><div><strong>Nexa Dev</strong><span>Content control</span></div></div>
      <nav class="dev-nav">
        <a href="index.html">Dashboard</a>
        <a href="products.html">Laptops</a>
        <a href="exams.html" class="active">Exams</a>
        <a href="notes.html">Notes</a>
        <a href="papers.html">Papers</a>
        <a href="site.html">Site info</a>
      </nav>
      <div class="dev-sidebar-foot"><a href="../index.html">← Public website</a></div>
    </aside>
    <main class="dev-main">
      <div class="dev-topbar">
        <div><h1>Exams</h1><p>Create and edit timed exams and question banks.</p></div>
        <button type="button" class="btn btn-primary" id="btn-add">Add exam</button>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table class="dev-table">
            <thead><tr><th>Title</th><th>Minutes</th><th>Questions</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div class="modal-backdrop" id="modal">
    <div class="modal" style="max-width:640px;">
      <div class="modal-head"><h3 id="modal-title">Add exam</h3><button type="button" class="btn btn-ghost btn-sm" data-close>Close</button></div>
      <div class="modal-body">
        <form id="form" class="form-grid">
          <input type="hidden" id="f-id">
          <div class="field"><label>ID (slug)</label><input id="f-slug" placeholder="html-css" required></div>
          <div class="field"><label>Minutes</label><input id="f-minutes" type="number" min="5" value="30" required></div>
          <div class="field full"><label>Title</label><input id="f-title" required></div>
          <div class="field full"><label>Description</label><input id="f-desc"></div>
          <div class="field full">
            <label>Questions JSON</label>
            <textarea id="f-questions" style="min-height:180px;" placeholder='[{"q":"Question?","opts":["A","B","C","D"],"a":0}]'></textarea>
            <p style="font-size:0.7rem;color:var(--dev-muted);margin-top:0.35rem;">Array of { q, opts[], a } where a is the correct option index (0-based).</p>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save">Save</button>
      </div>
    </div>
  </div>
  <script src="js/dev-store.js"></script>
  <script src="js/dev-ui.js"></script>
  <script>
  (function(){
    var editing=null;
    function render(){
      var list=NexaDev.getExams();
      var tbody=document.getElementById('tbody');
      if(!list.length){tbody.innerHTML='<tr><td colspan="4" class="empty">No exams yet.</td></tr>';return;}
      tbody.innerHTML=list.map(function(e){
        var n=(e.questions&&e.questions.length)||0;
        return '<tr><td><strong>'+DevUI.escapeHtml(e.title)+'</strong><div style="font-size:0.7rem;color:var(--dev-muted);">'+DevUI.escapeHtml(e.id)+'</div></td><td>'+e.minutes+'</td><td>'+n+'</td><td style="white-space:nowrap;"><button type="button" class="btn btn-ghost btn-sm" data-edit="'+DevUI.escapeHtml(e.id)+'">Edit</button> <button type="button" class="btn btn-danger btn-sm" data-del="'+DevUI.escapeHtml(e.id)+'">Delete</button></td></tr>';
      }).join('');
    }
    function openForm(exam){
      editing=exam?exam.id:null;
      document.getElementById('modal-title').textContent=exam?'Edit exam':'Add exam';
      document.getElementById('f-slug').value=exam?exam.id:'';
      document.getElementById('f-slug').disabled=!!exam;
      document.getElementById('f-title').value=exam?exam.title:'';
      document.getElementById('f-minutes').value=exam?exam.minutes:30;
      document.getElementById('f-desc').value=exam?exam.description||'':'';
      document.getElementById('f-questions').value=exam?JSON.stringify(exam.questions||[],null,2):'[\n  {"q":"Sample question?","opts":["A","B","C","D"],"a":0}\n]';
      DevUI.openModal('modal');
    }
    document.getElementById('btn-add').onclick=function(){openForm(null);};
    document.getElementById('tbody').onclick=function(e){
      var ed=e.target.getAttribute('data-edit');
      var del=e.target.getAttribute('data-del');
      if(ed){var x=NexaDev.getExams().find(function(i){return i.id===ed;});if(x)openForm(x);}
      if(del&&confirm('Delete this exam?')){NexaDev.deleteExam(del);render();DevUI.toast('Exam deleted','success');}
    };
    document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){DevUI.closeModal('modal');};});
    document.getElementById('btn-save').onclick=function(){
      var id=document.getElementById('f-slug').value.trim()||NexaDev.uid('exam');
      var title=document.getElementById('f-title').value.trim();
      if(!title){DevUI.toast('Title required','error');return;}
      var questions;
      try{questions=JSON.parse(document.getElementById('f-questions').value);}catch(err){DevUI.toast('Invalid questions JSON','error');return;}
      if(!Array.isArray(questions)){DevUI.toast('Questions must be an array','error');return;}
      NexaDev.upsertExam({
        id:editing||id,
        title:title,
        minutes:Number(document.getElementById('f-minutes').value)||30,
        description:document.getElementById('f-desc').value.trim(),
        questions:questions
      });
      DevUI.closeModal('modal');render();DevUI.toast('Exam saved','success');
    };
    render();
  })();
  </script>
</body>
</html>
