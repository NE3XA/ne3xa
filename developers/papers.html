<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papers — Nexa Dev</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dev.css">
</head>
<body>
  <div class="dev-shell">
    <aside class="dev-sidebar">
      <div class="dev-brand"><span class="dev-brand-mark">NX</span><div><strong>Nexa Dev</strong><span>Content control</span></div></div>
      <nav class="dev-nav">
        <a href="index.html">Dashboard</a>
        <a href="products.html">Laptops</a>
        <a href="exams.html">Exams</a>
        <a href="notes.html">Notes</a>
        <a href="papers.html" class="active">Papers</a>
        <a href="site.html">Site info</a>
      </nav>
      <div class="dev-sidebar-foot"><a href="../index.html">← Public website</a></div>
    </aside>
    <main class="dev-main">
      <div class="dev-topbar">
        <div><h1>Papers</h1><p>Create, edit or delete papers for learners.</p></div>
        <button type="button" class="btn btn-primary" id="btn-add">Add paper</button>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table class="dev-table">
            <thead><tr><th>Title</th><th>Language</th><th>Updated</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head"><h3 id="modal-title">Add paper</h3><button type="button" class="btn btn-ghost btn-sm" data-close>Close</button></div>
      <div class="modal-body">
        <form class="form-grid">
          <input type="hidden" id="f-id">
          <div class="field"><label>Title</label><input id="f-title" required></div>
          <div class="field"><label>Language</label><input id="f-lang" placeholder="Python"></div>
          <div class="field full"><label>Body</label><textarea id="f-body" style="min-height:200px;"></textarea></div>
        </form>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save">Save</button>
      </div>
    </div>
  </div>
  <script src="js/dev-store.js"></script>
  <script src="js/dev-ui.js"></script>
  <script>
  (function(){
    var editing=null;
    function render(){
      var list=NexaDev.getPapers();
      var tbody=document.getElementById('tbody');
      if(!list.length){tbody.innerHTML='<tr><td colspan="4" class="empty">Nothing yet.</td></tr>';return;}
      tbody.innerHTML=list.map(function(item){
        return '<tr><td><strong>'+DevUI.escapeHtml(item.title)+'</strong></td><td>'+DevUI.escapeHtml(item.language||'—')+'</td><td style="font-size:0.75rem;color:var(--dev-muted);">'+DevUI.formatDate(item.updated)+'</td><td style="white-space:nowrap;"><button type="button" class="btn btn-ghost btn-sm" data-edit="'+DevUI.escapeHtml(item.id)+'">Edit</button> <button type="button" class="btn btn-danger btn-sm" data-del="'+DevUI.escapeHtml(item.id)+'">Delete</button></td></tr>';
      }).join('');
    }
    function openForm(item){
      editing=item?item.id:null;
      document.getElementById('modal-title').textContent=item?'Edit paper':'Add paper';
      document.getElementById('f-id').value=item?item.id:'';
      document.getElementById('f-title').value=item?item.title:'';
      document.getElementById('f-lang').value=item?item.language||'':'';
      document.getElementById('f-body').value=item?item.body||'':'';
      DevUI.openModal('modal');
    }
    document.getElementById('btn-add').onclick=function(){openForm(null);};
    document.getElementById('tbody').onclick=function(e){
      var ed=e.target.getAttribute('data-edit');
      var del=e.target.getAttribute('data-del');
      if(ed){var x=NexaDev.getPapers().find(function(i){return i.id===ed;});if(x)openForm(x);}
      if(del&&confirm('Delete?')){NexaDev.deletePaper(del);render();DevUI.toast('Deleted','success');}
    };
    document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){DevUI.closeModal('modal');};});
    document.getElementById('btn-save').onclick=function(){
      var title=document.getElementById('f-title').value.trim();
      if(!title){DevUI.toast('Title required','error');return;}
      NexaDev.upsertPaper({
        id:editing||NexaDev.uid('paper'),
        title:title,
        language:document.getElementById('f-lang').value.trim(),
        body:document.getElementById('f-body').value
      });
      DevUI.closeModal('modal');render();DevUI.toast('Saved','success');
    };
    render();
  })();
  </script>
</body>
</html>
