<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptops — Nexa Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dev.css">
</head>
<body>
  <div class="dev-shell">
    <aside class="dev-sidebar">
      <div class="dev-brand">
        <span class="dev-brand-mark">NX</span>
        <div><strong>Nexa Dev</strong><span>Content control</span></div>
      </div>
      <nav class="dev-nav">
        <a href="index.html">Dashboard</a>
        <a href="products.html" class="active">Laptops</a>
        <a href="exams.html">Exams</a>
        <a href="notes.html">Notes</a>
        <a href="papers.html">Papers</a>
        <a href="site.html">Site info</a>
      </nav>
      <div class="dev-sidebar-foot">
        <a href="../index.html">← Public website</a>
      </div>
    </aside>
    <main class="dev-main">
      <div class="dev-topbar">
        <div>
          <h1>Laptops</h1>
          <p>Create, edit or remove products shown in the store data layer.</p>
        </div>
        <button type="button" class="btn btn-primary" id="btn-add">Add laptop</button>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Catalogue</h2>
          <input type="search" id="search" placeholder="Search…" style="padding:0.4rem 0.65rem;background:var(--dev-bg);border:1px solid var(--dev-border);border-radius:6px;min-width:180px;">
        </div>
        <div class="table-wrap">
          <table class="dev-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Brand</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">Add laptop</h3>
        <button type="button" class="btn btn-ghost btn-sm" data-close>Close</button>
      </div>
      <div class="modal-body">
        <form id="form" class="form-grid">
          <input type="hidden" id="f-id">
          <div class="field"><label>Name</label><input id="f-name" required></div>
          <div class="field"><label>Brand</label><input id="f-brand" required></div>
          <div class="field">
            <label>Category</label>
            <select id="f-category">
              <option value="student">Student</option>
              <option value="business">Business</option>
              <option value="developer">Developer</option>
              <option value="gaming">Gaming</option>
              <option value="budget">Budget</option>
            </select>
          </div>
          <div class="field"><label>Price (USD)</label><input id="f-price" type="number" min="0" step="1" required></div>
          <div class="field"><label>Processor</label><input id="f-processor"></div>
          <div class="field"><label>RAM</label><input id="f-ram" placeholder="16GB"></div>
          <div class="field"><label>Storage</label><input id="f-storage" placeholder="512GB SSD"></div>
          <div class="field"><label>Display</label><input id="f-display"></div>
          <div class="field"><label>OS</label><input id="f-os"></div>
          <div class="field"><label>Stock</label><input id="f-stock" type="number" min="0" value="1"></div>
          <div class="field full"><label>Image path or URL</label><input id="f-image" placeholder="../images/laptop-1.svg"></div>
          <div class="field full"><label>Description</label><textarea id="f-desc"></textarea></div>
        </form>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save">Save</button>
      </div>
    </div>
  </div>

  <script src="js/dev-store.js"></script>
  <script src="js/dev-ui.js"></script>
  <script>
    (function () {
      var editingId = null;

      function render() {
        var q = (document.getElementById('search').value || '').toLowerCase();
        var list = NexaDev.getProducts().filter(function (p) {
          if (!q) return true;
          return (p.name + ' ' + p.brand + ' ' + p.category).toLowerCase().indexOf(q) !== -1;
        });
        var tbody = document.getElementById('tbody');
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">No laptops yet. Add one.</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(function (p) {
          return '<tr>' +
            '<td><strong>' + DevUI.escapeHtml(p.name) + '</strong></td>' +
            '<td>' + DevUI.escapeHtml(p.brand) + '</td>' +
            '<td><span class="badge">' + DevUI.escapeHtml(p.category) + '</span></td>' +
            '<td>$' + Number(p.price).toLocaleString() + '</td>' +
            '<td>' + (p.stock != null ? p.stock : '—') + '</td>' +
            '<td style="white-space:nowrap;">' +
            '<button type="button" class="btn btn-ghost btn-sm" data-edit="' + DevUI.escapeHtml(p.id) + '">Edit</button> ' +
            '<button type="button" class="btn btn-danger btn-sm" data-del="' + DevUI.escapeHtml(p.id) + '">Delete</button>' +
            '</td></tr>';
        }).join('');
      }

      function openForm(product) {
        editingId = product ? product.id : null;
        document.getElementById('modal-title').textContent = product ? 'Edit laptop' : 'Add laptop';
        document.getElementById('f-id').value = product ? product.id : '';
        document.getElementById('f-name').value = product ? product.name : '';
        document.getElementById('f-brand').value = product ? product.brand : '';
        document.getElementById('f-category').value = product ? product.category : 'student';
        document.getElementById('f-price').value = product ? product.price : '';
        document.getElementById('f-processor').value = product ? (product.processor || '') : '';
        document.getElementById('f-ram').value = product ? (product.ram || '') : '';
        document.getElementById('f-storage').value = product ? (product.storage || '') : '';
        document.getElementById('f-display').value = product ? (product.display || '') : '';
        document.getElementById('f-os').value = product ? (product.os || '') : '';
        document.getElementById('f-stock').value = product && product.stock != null ? product.stock : 1;
        document.getElementById('f-image').value = product ? (product.image || '') : '../images/laptop-1.svg';
        document.getElementById('f-desc').value = product ? (product.description || '') : '';
        DevUI.openModal('modal');
      }

      document.getElementById('btn-add').addEventListener('click', function () { openForm(null); });
      document.getElementById('search').addEventListener('input', render);

      document.getElementById('tbody').addEventListener('click', function (e) {
        var edit = e.target.getAttribute('data-edit');
        var del = e.target.getAttribute('data-del');
        if (edit) {
          var p = NexaDev.getProducts().find(function (x) { return x.id === edit; });
          if (p) openForm(p);
        }
        if (del) {
          if (!confirm('Delete this laptop?')) return;
          NexaDev.deleteProduct(del);
          render();
          DevUI.toast('Laptop deleted', 'success');
        }
      });

      document.querySelectorAll('[data-close]').forEach(function (btn) {
        btn.addEventListener('click', function () { DevUI.closeModal('modal'); });
      });
      document.getElementById('modal').addEventListener('click', function (e) {
        if (e.target.id === 'modal') DevUI.closeModal('modal');
      });

      document.getElementById('btn-save').addEventListener('click', function () {
        var name = document.getElementById('f-name').value.trim();
        var brand = document.getElementById('f-brand').value.trim();
        var price = Number(document.getElementById('f-price').value);
        if (!name || !brand || !price) {
          DevUI.toast('Name, brand and price are required', 'error');
          return;
        }
        var product = {
          id: editingId || NexaDev.uid('lp'),
          name: name,
          brand: brand,
          category: document.getElementById('f-category').value,
          price: price,
          processor: document.getElementById('f-processor').value.trim(),
          ram: document.getElementById('f-ram').value.trim(),
          storage: document.getElementById('f-storage').value.trim(),
          display: document.getElementById('f-display').value.trim(),
          os: document.getElementById('f-os').value.trim(),
          stock: Number(document.getElementById('f-stock').value) || 0,
          image: document.getElementById('f-image').value.trim() || '../images/laptop-1.svg',
          description: document.getElementById('f-desc').value.trim()
        };
        NexaDev.upsertProduct(product);
        DevUI.closeModal('modal');
        render();
        DevUI.toast(editingId ? 'Laptop updated' : 'Laptop added', 'success');
      });

      render();
    })();
  </script>
</body>
</html>
